<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Rastreo: dos aplicaciones, una para compartir tu ubicación y otra para monitorearla." />
    <title>Rastreo</title>
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        color-scheme: light;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --surface: #111827;
          --text: #e5e7eb;
          --muted: #9ca3af;
          --border: #1f2937;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 16px;
      }
      h1 {
        margin: 0 0 4px;
      }
      p {
        color: var(--muted);
      }
      .apps {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        margin-top: 24px;
      }
      a.app {
        display: grid;
        gap: 8px;
        padding: 20px;
        border-radius: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-top: 6px solid var(--accent);
        color: inherit;
        text-decoration: none;
      }
      a.app:hover,
      a.app:focus-visible {
        outline: 3px solid var(--accent);
      }
      a.app img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      a.app strong {
        font-size: 1.2rem;
      }
      a.app span {
        color: var(--muted);
      }
      .compartir {
        --accent: #0f766e;
      }
      .monitoreo {
        --accent: #4f46e5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rastreo</h1>
      <p>Dos aplicaciones independientes que trabajan juntas.</p>
      <div class="apps">
        <a class="app compartir" href="./compartir/">
          <img src="./compartir/icons/icon-192.png" alt="" />
          <strong>App de ubicación</strong>
          <span>Para quien comparte su ubicación desde el celular. Crea la sesión y entrega el código.</span>
        </a>
        <a class="app monitoreo" href="./monitoreo/">
          <img src="./monitoreo/icons/icon-192.png" alt="" />
          <strong>App de monitoreo</strong>
          <span>Para quien observa. Ingresa el código y mira la ubicación en vivo en el mapa.</span>
        </a>
      </div>
    </main>
  </body>
</html>
